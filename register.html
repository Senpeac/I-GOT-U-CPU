<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สมัครสมาชิก | NeonByte</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="script.js"></script>
</head>
<body>
  <header>
    <div class="navbar">
      <a class="logo" href="index.html">NEON<span>BYTE</span></a>
      <nav class="nav-links">
        <a href="index.html">หน้าแรก</a>
        <a href="index.html#products">สินค้า</a>
        <a href="index.html#about">เกี่ยวกับเรา</a>
        <a href="index.html#contact">ติดต่อ</a>
        <a href="cart.html">ตะกร้า</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="auth-wrapper">
      <h2>สร้างบัญชีใหม่</h2>
      <form id="register-form">
        <label>
          ชื่อ-นามสกุล
          <input type="text" name="fullname" placeholder="ชื่อจริง นามสกุล" required>
        </label>
        <label>
          อีเมล
          <input type="email" name="email" placeholder="you@example.com" required>
        </label>
        <label>
          รหัสผ่าน
          <input type="password" name="password" placeholder="อย่างน้อย 8 ตัว" minlength="8" required>
        </label>
        <div class="form-actions">
          <button class="btn-primary" type="submit">สมัครสมาชิก</button>
        </div>
      </form>
      <p class="alt-link">มีบัญชีแล้ว? <a href="login.html">เข้าสู่ระบบ</a></p>
    </section>
  </main>

  <footer>
    <div class="footer-content">
      <div>
        <h4>NeonByte HQ</h4>
        <p>99/9 ถนนอนาคต ตำบลไฮเทค จังหวัดกรุงเทพมหานคร 10240</p>
      </div>
      <div>
        <h4>ติดต่อเรา</h4>
        <p>โทร: 02-123-4567</p>
        <p>Email: hello@neonbyte.store</p>
      </div>
      <div>
        <h4>โซเชียล</h4>
        <div class="social-links">
          <a href="#">Facebook</a>
          <a href="#">Instagram</a>
          <a href="#">YouTube</a>
        </div>
      </div>
    </div>
  </footer>
</body>
</html>
